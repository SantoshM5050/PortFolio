<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050a15" />
      <stop offset="100%" stop-color="#020409" />
    </linearGradient>

    <!-- Glowing Cyber Border Gradient -->
    <linearGradient id="cyberRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <!-- Text Neon Gradient -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#00f0ff" />
      <stop offset="100%" stop-color="#7000ff" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Hexagon Container -->
  <rect x="4" y="4" width="92" height="92" rx="24" fill="url(#bgGrad)" stroke="url(#cyberRing)" stroke-width="4" filter="url(#glow)" />
  
  <!-- Corner Tech Accents -->
  <circle cx="16" cy="16" r="3" fill="#00f0ff" opacity="0.8" />
  <circle cx="84" cy="84" r="3" fill="#a855f7" opacity="0.8" />

  <!-- Monogram Logo "SM" -->
  <g filter="url(#glow)">
    <text
      x="50"
      y="63"
      font-family="Orbitron, system-ui, -apple-system, sans-serif"
      font-size="44"
      font-weight="900"
      letter-spacing="-1"
      fill="url(#textGrad)"
      text-anchor="middle"
    >SM</text>
  </g>

  <!-- Glowing Accent Core Dot -->
  <circle cx="78" cy="26" r="4" fill="#00f0ff" filter="url(#glow)" />
</svg>